<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Від чату до агента</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column of numbered stages, a sticky progress rail on top; simulators break out to a wider two-pane grid. */
/* Design system: shadcn/ui tokens, Zinc theme (ui.shadcn.com/themes); type: Geist (vercel.com/font);
   motion: Open Props easings (open-props.style). Semantic accents from the Tailwind palette:
   agent = emerald, human manual work = amber. */
:root {
  --bg: #fafafa;            /* zinc-50 */
  --surface: #ffffff;       /* card */
  --sunk: #f4f4f5;          /* muted, zinc-100 */
  --ink: #09090b;           /* foreground, zinc-950 */
  --muted: #71717a;         /* muted-foreground, zinc-500 */
  --line: #e4e4e7;          /* border, zinc-200 */
  --accent: #047857;        /* agent / action, emerald-700 */
  --accent-soft: #ecfdf5;   /* emerald-50 */
  --manual: #b45309;        /* human manual work, amber-700 */
  --manual-soft: #fffbeb;   /* amber-50 */
  --bad: #b91c1c; --bad-soft: #fef2f2;
  --good: #15803d; --good-soft: #f0fdf4;
  --focus: #a1a1aa;         /* ring, zinc-400 */
  --primary: #18181b; --primary-fg: #fafafa;
  --font-display: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .08), 0 4px 6px -4px rgb(0 0 0 / .06);
  --ease-3: cubic-bezier(.25, 0, .3, 1);
  --ease-out-3: cubic-bezier(0, 0, .3, 1);
  --ease-out-5: cubic-bezier(0, 0, .1, 1);
  --ease-in-out-3: cubic-bezier(.25, 0, .75, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --surface: #0f0f12; --sunk: #18181b; --ink: #fafafa; --muted: #a1a1aa; --line: #27272a;
    --accent: #34d399; --accent-soft: #022c22; --manual: #fbbf24; --manual-soft: #2a1606;
    --bad: #f87171; --bad-soft: #2a0a0a; --good: #4ade80; --good-soft: #052e16; --focus: #52525b;
    --primary: #fafafa; --primary-fg: #18181b;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / .4); --shadow-lg: 0 10px 30px -5px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --surface: #0f0f12; --sunk: #18181b; --ink: #fafafa; --muted: #a1a1aa; --line: #27272a;
  --accent: #34d399; --accent-soft: #022c22; --manual: #fbbf24; --manual-soft: #2a1606;
  --bad: #f87171; --bad-soft: #2a0a0a; --good: #4ade80; --good-soft: #052e16; --focus: #52525b;
  --primary: #fafafa; --primary-fg: #18181b;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / .4); --shadow-lg: 0 10px 30px -5px rgb(0 0 0 / .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16.5px; line-height: 1.6; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 68ch; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(40px, 6.6vw, 72px); letter-spacing: -0.045em; line-height: 1; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 3.8vw, 40px); letter-spacing: -0.035em; line-height: 1.1; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--font-mono); font-size: 0.88em; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-soft); color: var(--ink); }
body { -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11"; }
.eyebrow { font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lead { font-size: 19px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* progress rail */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.rail .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.rail a { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; text-decoration: none; color: var(--muted); font-size: 13.5px; padding: 5px 10px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.rail a:hover { border-color: var(--line); color: var(--ink); }
.rail .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
.rail a.done .dot { background: var(--accent); border-color: var(--accent); }
.rail a.done { color: var(--ink); }
.rail a.cur { color: var(--ink); background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-sm); }

header.hero { padding-block: 56px 28px; }
header.hero .wrap { display: grid; gap: 20px; }
.thesis { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.thesis > div { padding: 18px 20px; min-width: 0; }
.thesis > div + div { border-left: 1px solid var(--line); }
.thesis .k { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
.thesis .chat .k { color: var(--manual); }
.thesis .agent .k { color: var(--accent); }
.thesis .v { font-size: 20px; font-weight: 600; margin-top: 4px; }

section.stage { padding-block: 48px; border-top: 1px solid var(--line); scroll-margin-top: 60px; }
.stage-head { display: grid; gap: 10px; margin-bottom: 24px; }
.stage-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .02em; text-transform: uppercase; }
.meta { font-size: 13.5px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; min-width: 0; box-shadow: var(--shadow-sm); }
.note { border-left: 3px solid var(--accent); padding: 10px 14px; background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.note.warn { border-color: var(--manual); background: var(--manual-soft); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 15px; border-radius: 8px; font-size: 14.5px; font-weight: 500; text-align: left; box-shadow: var(--shadow-sm); transition: background .15s var(--ease-3), border-color .15s var(--ease-3), transform .15s var(--ease-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:hover:not(:disabled) { background: var(--sunk); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.primary:hover:not(:disabled) { background: var(--primary); opacity: .9; }
.btn.manual { border-color: var(--manual); color: var(--manual); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 13.5px; }
.skip { background: none; border: none; color: var(--muted); font-size: 13.5px; text-decoration: underline; padding: 0; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 14.5px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* ladder */
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: end; }
.step { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.step:nth-child(1) { min-height: 150px; } .step:nth-child(2) { min-height: 190px; } .step:nth-child(3) { min-height: 230px; } .step:nth-child(4) { min-height: 270px; }
.step .lvl { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.step .nm { font-weight: 700; font-size: 17px; }
.step .add { font-size: 14px; color: var(--accent); font-weight: 600; }
.step .prod { margin-top: auto; font-size: 13.5px; color: var(--muted); }
.step[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.who-axis { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 10px; gap: 12px; }
.who-axis .bar { flex: 1; height: 2px; align-self: center; background: linear-gradient(90deg, var(--manual), var(--accent)); }
.vendors { display: flex; flex-wrap: wrap; gap: 6px; }
.lvl-detail { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.lvl-detail ul { margin: 6px 0 0; padding-left: 20px; }
.can, .cant { font-size: 14.5px; }
.can li::marker { content: "✓  "; color: var(--good); }
.cant li::marker { content: "✕  "; color: var(--bad); }

/* simulator */
.sim { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pane { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.pane-h { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); gap: 8px; }
.pane-h .t { font-weight: 700; }
.pane.chat .pane-h { background: var(--manual-soft); }
.pane.agent .pane-h { background: var(--accent-soft); }
.log { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 320px; max-height: 520px; overflow-y: auto; font-size: 14.5px; }
.msg { padding: 9px 12px; border-radius: 10px; max-width: 92%; }
.msg.u { align-self: flex-end; background: var(--sunk); }
.msg.a { align-self: flex-start; border: 1px solid var(--line); }
.msg.paste { font-family: var(--font-mono); font-size: 12.5px; color: var(--manual); border: 1px dashed var(--manual); background: transparent; }
mark.unv { background: var(--bad-soft); color: var(--ink); border-bottom: 2px solid var(--bad); padding: 0 2px; }
mark.ok { background: var(--good-soft); color: var(--ink); border-bottom: 2px solid var(--good); padding: 0 2px; }
.actions { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.counters { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.counters div { padding: 8px 10px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.3; }
.counters div + div { border-left: 1px solid var(--line); }
.counters b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.astep { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: start; animation: rise .25s ease-out; }
.tag { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; padding: 3px 7px; border-radius: 6px; text-align: center; letter-spacing: 0.02em; }
.tag.think { background: var(--sunk); color: var(--muted); }
.tag.act { background: var(--accent-soft); color: var(--accent); }
.tag.check { background: var(--good-soft); color: var(--good); }
.tag.ask { background: var(--manual-soft); color: var(--manual); }
.tag.done { background: var(--accent); color: var(--bg); }
.tool { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
@keyframes rise { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .astep { animation: none; } * { scroll-behavior: auto !important; } }

.why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.why .card h3 { font-size: 16px; margin-bottom: 4px; }
.next-q { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.term { font-family: var(--font-mono); font-size: 13px; background: #101512; color: #d8e3dc; border-radius: 8px; padding: 12px 14px; overflow-x: auto; white-space: pre-wrap; }
.term .p { color: #7fd1bb; }
.term .e { color: #ff9b8f; }
.term .ok { color: #9ad39f; }

/* inside */
.formula { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.part { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface); min-width: 0; }
.part .ic { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.part h3 { font-size: 16.5px; margin: 4px 0; }
.part p { font-size: 14px; color: var(--muted); }
.loop-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }
.loop svg { width: 100%; height: auto; display: block; }
.loop .n rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: all .2s; }
.loop .n text { fill: var(--ink); font-family: var(--font-body); font-size: 14px; font-weight: 600; }
.loop .n.on rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.loop .edge { stroke: var(--muted); fill: none; stroke-width: 1.5; }
.loop .lbl { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-opts .btn.right { border-color: var(--good); background: var(--good-soft); }
.quiz-opts .btn.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { font-size: 14.5px; padding: 8px 12px; border-radius: 8px; }
.fb.good { background: var(--good-soft); }
.fb.bad { background: var(--bad-soft); }
.match { display: grid; gap: 8px; }
.match label { display: grid; grid-template-columns: 1fr 180px; gap: 10px; align-items: center; font-size: 15px; }
select, input[type="text"], textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 120px; resize: vertical; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.5; }
.files { display: grid; grid-template-columns: 290px 1fr; gap: 14px; }
.tree { font-family: var(--font-mono); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.tree button { text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; font-family: var(--font-mono); font-size: 13px; }
.tree button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.tree .dim { color: var(--muted); padding: 4px 8px; }
.tree .note-s { font-family: var(--font-body); font-size: 12px; color: var(--muted); display: block; }
pre.file { margin: 0; font-family: var(--font-mono); font-size: 13px; line-height: 1.55; background: var(--sunk); border-radius: 8px; padding: 14px; white-space: pre-wrap; overflow-x: auto; min-width: 0; }
pre.file .h { color: var(--accent); font-weight: 600; }
pre.file .c { color: var(--muted); }

/* rules builder */
.levels { display: flex; gap: 6px; flex-wrap: wrap; }
.levels span { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.levels span.on { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.levels span.done { border-color: var(--accent); color: var(--accent); }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14.5px; }
.checklist li::before { content: "○"; display: inline-block; width: 22px; color: var(--muted); }
.checklist li.hit::before { content: "●"; color: var(--good); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.order li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14.5px; }
.order li.ok { border-color: var(--good); }
.order li.no { border-color: var(--bad); }
.order .n { font-family: var(--font-mono); color: var(--muted); font-size: 13px; }
.order .mv { display: flex; gap: 4px; }
.order .mv button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 30px; height: 28px; }

/* judge */
.sort { display: grid; gap: 8px; }
.sort .item { display: grid; grid-template-columns: 1fr 230px; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
.sort .item.ok { border-color: var(--good); }
.sort .item.no { border-color: var(--bad); }
.sort .item .ex { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }
.draft { line-height: 1.9; font-size: 15.5px; }
.draft .s { cursor: pointer; border-radius: 4px; padding: 1px 2px; border-bottom: 1px dotted var(--muted); }
.draft .s:hover { background: var(--sunk); }
.draft .s.found { background: var(--bad-soft); border-bottom: 2px solid var(--bad); }
.draft .s.miss { background: var(--sunk); text-decoration: line-through; text-decoration-color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.two ul { margin: 6px 0 0; padding-left: 20px; font-size: 15px; }

/* tools */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; background: var(--sunk); }
tr:last-child td { border-bottom: none; }
.score { font-family: var(--font-mono); letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
.score i { color: var(--line); font-style: normal; }
.std { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* start */
.steps-l { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: s; }
.steps-l > li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.steps-l > li.done { border-color: var(--accent); }
.steps-l input[type="checkbox"] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); }
.steps-l h3 { font-size: 16.5px; }
.steps-l .body { display: grid; gap: 8px; min-width: 0; }
.prompt { position: relative; }
.prompt pre { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 13px; background: var(--sunk); border-radius: 8px; padding: 12px 14px; padding-right: 110px; }
.prompt .copy { position: absolute; top: 8px; right: 8px; }
.alt { font-size: 13.5px; color: var(--muted); }
.gen { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.gen label { display: grid; gap: 4px; font-size: 14px; font-weight: 500; }
.gen .full { grid-column: 1 / -1; }
.plan30 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.plan30 .card .w { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.result { border: 2px solid var(--accent); border-radius: var(--r); padding: 18px 20px; background: var(--accent-soft); }
.system { display: flex; flex-wrap: wrap; gap: 8px; }
.system span { font-size: 13.5px; padding: 4px 10px; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted); font-family: var(--font-mono); }
.system span.on { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
footer { padding-block: 40px 60px; color: var(--muted); font-size: 13.5px; border-top: 1px solid var(--line); }
.tip { border-bottom: 1px dotted var(--muted); cursor: help; }

@media (max-width: 760px) {
  body { font-size: 16px; }
  .thesis, .sim, .why, .next-q, .lvl-detail, .loop-wrap, .files, .cmp, .two, .std, .gen, .plan30 { grid-template-columns: 1fr; }
  .thesis > div + div { border-left: none; border-top: 1px solid var(--line); }
  .ladder { grid-template-columns: 1fr 1fr; }
  .step:nth-child(n) { min-height: 0; }
  .formula { grid-template-columns: 1fr 1fr; }
  .match label, .sort .item { grid-template-columns: 1fr; }
  .loop-wrap .loop { max-width: 300px; }
  .astep { grid-template-columns: 1fr; gap: 4px; }
  .astep .tag { justify-self: start; }
}

/* track picker */
.tracks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.track { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 4px; min-width: 0; }

.sub-flow > div { text-align: center; }

.dep-wrap { display: grid; grid-template-columns: 1fr; gap: 12px; }

.dep-node.cur rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; } .dep-node.cur text { fill: var(--ink); font-weight: 600; }
.dep-node:hover rect, .dep-node:focus rect { stroke: var(--accent); }

/* ===== presentation mode (deck.js): one slide at a time ===== */
.deck-prog { height: 2px; background: transparent; }
.deck-prog span { display: block; height: 100%; width: 0; background: var(--ink); transition: width .5s var(--ease-out-5); }
body.deck { padding-bottom: 92px; }
body.deck main, body.deck header.hero, body.deck footer { overflow-x: clip; }
body.deck header.hero:not(.slide-on), body.deck main > section:not(.slide-on), body.deck footer:not(.slide-on) { display: none !important; }
body.deck .slide-on [data-s]:not(.s-on) { display: none !important; }
body.deck section.stage { border-top: 0; padding-block: 40px 24px; min-height: calc(100svh - 160px); }
body.deck header.hero { min-height: calc(100svh - 160px); padding-block: 48px 24px; }
body.deck .slide-on.sub-n .stage-head > p, body.deck .slide-on.sub-n .stage-head > .row, body.deck .slide-on.sub-n .stage-head > .skip { display: none; }
body.deck .slide-on.sub-n .stage-head h2 { font-size: clamp(20px, 2.4vw, 24px); color: var(--muted); }
.slide-in > .wrap { animation: slide-in .55s var(--ease-out-5) both; }
.slide-in.back > .wrap { animation-name: slide-back; }
@keyframes slide-in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slide-back { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
.deckbar { display: none; }
body.deck .deckbar { display: flex; position: fixed; z-index: 30; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(720px, calc(100% - 32px)); align-items: center; gap: 8px; padding: 8px; border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: var(--shadow-lg); }
.db-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 44px; min-width: 44px; padding: 0 16px; font-weight: 500; font-size: 14.5px; transition: transform .2s var(--ease-3), opacity .2s; }
.db-btn:disabled { opacity: .35; cursor: default; }
.db-btn.next { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.db-btn.next.nudge { animation: nudge 2.4s var(--ease-in-out-3) infinite; }
@keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: translateX(4px); } 90% { transform: translateX(-1px); } }
.db-mid { flex: 1; min-width: 0; display: grid; text-align: center; line-height: 1.25; }
.db-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.db-count { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
@media (max-width: 520px) { .db-btn.next #db-next-t { display: none; } .db-title { font-size: 12.5px; } }

/* ===== intro ===== */
.intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); overflow: hidden; padding: 24px 16px; transition: opacity .7s var(--ease-out-3), transform .7s var(--ease-out-3), filter .7s; }
.intro.out { opacity: 0; transform: scale(1.04); filter: blur(8px); pointer-events: none; }
.intro-bg { position: absolute; inset: 0; pointer-events: none; }
.intro-bg .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: drift 16s var(--ease-in-out-3) infinite alternate; }
.o1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -16vmax; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 45%, transparent), transparent 65%); }
.o2 { width: 40vmax; height: 40vmax; right: -14vmax; bottom: -16vmax; background: radial-gradient(circle, color-mix(in srgb, var(--manual) 35%, transparent), transparent 65%); animation-delay: -6s !important; }
.o3 { width: 26vmax; height: 26vmax; left: 45%; top: 55%; background: radial-gradient(circle, color-mix(in srgb, var(--ink) 12%, transparent), transparent 65%); animation-delay: -10s !important; }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
.grain { position: absolute; inset: 0; opacity: .05; background-image: radial-gradient(var(--ink) 1px, transparent 1px); background-size: 3px 3px; mix-blend-mode: multiply; }
.intro-floats .fl-i { position: absolute; font-size: 22px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); backdrop-filter: blur(6px); box-shadow: var(--shadow-sm); animation: bob 6s var(--ease-in-out-3) infinite; opacity: 0; animation-fill-mode: both; }
.f1 { left: 12%; top: 20%; animation-delay: .2s !important; } .f2 { right: 14%; top: 16%; animation-delay: 1.1s !important; } .f3 { left: 18%; bottom: 18%; animation-delay: 2s !important; } .f4 { right: 20%; bottom: 22%; animation-delay: .6s !important; } .f5 { left: 30%; top: 9%; animation-delay: 1.6s !important; }
@keyframes bob { 0% { opacity: 0; transform: translateY(12px) rotate(-4deg); } 15% { opacity: 1; } 50% { transform: translateY(-10px) rotate(3deg); } 100% { opacity: 1; transform: translateY(12px) rotate(-4deg); } }
@media (max-width: 640px) { .intro-floats { display: none; } }
.intro-in { position: relative; max-width: 640px; text-align: center; display: grid; gap: 14px; justify-items: center; }
.intro-mark { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); font-size: 36px; animation: pop-in .8s var(--ease-out-5) both; }
.wave { display: inline-block; transform-origin: 70% 70%; animation: wave 2.2s var(--ease-in-out-3) .9s 2; }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(10deg); } }
@keyframes pop-in { from { opacity: 0; transform: scale(.6) translateY(10px); } to { opacity: 1; transform: none; } }
.intro-k { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); animation: fade-up .7s var(--ease-out-5) .25s both; }
.intro h1 { font-size: clamp(56px, 11vw, 112px); letter-spacing: -0.06em; }
.intro-line { animation: fade-up .9s var(--ease-out-5) both; font-size: clamp(19px, 2.6vw, 24px); letter-spacing: -0.015em; line-height: 1.4; text-wrap: balance; }
.intro-line em { font-style: normal; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, var(--manual))); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 600; }
.l1 { animation-delay: .45s; } .l2 { animation-delay: 1.1s; color: var(--muted); } .l3 { animation-delay: 1.9s; } .l4 { animation-delay: 2.5s; } .l5 { animation-delay: 3.1s; } .l6 { animation-delay: 3.4s; }
@keyframes fade-up { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.intro.ready .intro-line, .intro.ready .intro-k, .intro.ready .intro-mark { opacity: 1 !important; transform: none !important; filter: none !important; }
.intro-cta { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.btn-lux { position: relative; overflow: hidden; border: 0; border-radius: 999px; padding: 15px 28px; font-size: 16px; font-weight: 600; background: var(--primary); color: var(--primary-fg); box-shadow: var(--shadow-lg); transition: transform .25s var(--ease-3), box-shadow .25s; }
.btn-lux::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgb(255 255 255 / .28) 50%, transparent 70%); transform: translateX(-100%); animation: shine 3.2s var(--ease-in-out-3) 4s infinite; }
.btn-lux:hover { transform: translateY(-2px); }
.btn-lux.small { padding: 10px 18px; font-size: 14px; }
.btn-lux span { display: inline-block; transition: transform .25s var(--ease-3); } .btn-lux:hover span { transform: translateX(3px); }
@keyframes shine { 0% { transform: translateX(-100%); } 40%, 100% { transform: translateX(100%); } }
.btn-ghost { border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 999px; padding: 14px 22px; font-size: 15px; font-weight: 500; }
.btn-ghost:hover { background: var(--surface); }
.intro-facts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 13px !important; color: var(--muted); }
.intro-facts span { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--surface) 60%, transparent); }
@media (prefers-reduced-motion: reduce) { .intro *, .intro { animation: none !important; transition: none !important; } .intro-floats .fl-i { opacity: 1; } .slide-in > .wrap { animation: none; } .btn-lux::after { display: none; } }

/* ===== achievements & toasts ===== */
.toasts { position: fixed; z-index: 60; top: 64px; right: 16px; display: grid; gap: 10px; width: min(360px, calc(100% - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(12px); box-shadow: var(--shadow-lg); animation: toast-in .6s var(--ease-out-5) both; }
.toast.bye { animation: toast-out .4s var(--ease-in-out-3) both; }
.toast .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--accent-soft); }
.toast b { display: block; font-size: 14.5px; letter-spacing: -0.01em; }
.toast span { font-size: 13px; color: var(--muted); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-10px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateX(20px); } }
.confetti { position: fixed; z-index: 70; pointer-events: none; width: 8px; height: 12px; border-radius: 2px; top: 0; left: 0; will-change: transform, opacity; }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } .toast { animation: none; } }

/* ===== finish ===== */
.cert { display: grid; gap: 10px; }
.cert-in { position: relative; border-radius: 20px; padding: clamp(24px, 5vw, 48px); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); text-align: center; display: grid; gap: 14px; justify-items: center; overflow: hidden; }
.cert-in::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--line); border-radius: 14px; pointer-events: none; }
.cert-in::after { content: ""; position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent, color-mix(in srgb, var(--accent) 5%, transparent), transparent 30%); animation: spin 14s linear infinite; pointer-events: none; }
.cert-in > * { position: relative; z-index: 1; }
.cert-k { font-family: var(--font-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cert-name { font: 700 clamp(30px, 5vw, 52px)/1.1 var(--font-display); letter-spacing: -0.045em; text-align: center; border: 0; border-bottom: 1px dashed var(--line); background: transparent; color: var(--ink); width: min(100%, 520px); padding: 4px 0; }
.cert-name:focus { outline: none; border-bottom-color: var(--ink); }
.cert-what { color: var(--muted); }
.cert-what b { color: var(--ink); }
.cert-foot { display: flex; gap: 18px; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.cert-seal { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); font-size: 18px; }
.achs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 640px; }
.ach { display: grid; gap: 6px; justify-items: center; padding: 12px 6px; border-radius: 12px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.25; text-align: center; }
.ach .bi { font-size: 24px; filter: grayscale(1); opacity: .35; }
.ach.on { color: var(--ink); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.ach.on .bi { filter: none; opacity: 1; }
@media (max-width: 640px) { .achs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ai-prompt pre { max-height: 340px; overflow: auto; }
.wall-form { display: grid; gap: 10px; }
.wall-form textarea { min-height: 96px; font-family: var(--font-body); }
.wall-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.wall-item { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); font-size: 14.5px; animation: fade-up .6s var(--ease-out-5) both; overflow-wrap: anywhere; }
.wall-item .w-d { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.wall-empty { color: var(--muted); font-size: 14px; grid-column: 1 / -1; }

/* ===== affordance: everything clickable looks clickable ===== */
button.step, button.track { position: relative; cursor: pointer; transition: transform .25s var(--ease-3), box-shadow .25s var(--ease-3), border-color .2s, background .2s; }
button.step:hover, button.track:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); }
button.step:active, button.track:active { transform: translateY(-1px); }
button.step::after, button.track::after { content: "+"; position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 500 16px/1 var(--font-body); color: var(--muted); border: 1px solid var(--line); background: var(--surface); transition: transform .25s var(--ease-3), background .2s, color .2s; }
button.step:hover::after, button.track:hover::after { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); transform: rotate(90deg); }
button.step[aria-pressed="true"]::after, button.track[aria-pressed="true"]::after { content: "✓"; font-size: 12px; background: var(--accent); border-color: var(--accent); color: var(--surface); transform: none; }
button.step[aria-pressed="true"] { background: var(--accent-soft); }
button.step[aria-pressed="true"]::before { content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; background: var(--accent-soft); border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: translateX(-50%) rotate(45deg); }
button.step:not([aria-pressed="true"])::after { animation: tap-hint 2.8s var(--ease-in-out-3) 1.2s 3; }
@media (max-width: 760px) { button.step[aria-pressed="true"]::before { display: none; } }
@keyframes tap-hint { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); } }
#ladder-steps { position: relative; margin-top: 34px; }
#ladder-steps::before { content: "Натисни на сходинку, і її розбір відкриється нижче ↓"; position: absolute; top: -30px; left: 0; font-size: 13.5px; font-weight: 500; color: var(--ink); }
.tree button, .src-tree button { cursor: pointer; transition: background .15s, border-color .15s, padding-left .2s var(--ease-3); }
.tree button:hover:not([aria-pressed="true"]) { background: var(--sunk); border-color: var(--line); padding-left: 12px; }
.tree button:not([aria-pressed="true"])::after { content: " →"; opacity: 0; transition: opacity .15s; }
.tree button:hover::after { opacity: .6; }
@media (prefers-reduced-motion: reduce) { button.step::after { animation: none !important; } button.step:hover, button.track:hover { transform: none; } }
@media (hover: none) { button.step::after, button.track::after { width: 28px; height: 28px; } }

/* interactive architecture diagram */
#arch [data-g] { cursor: pointer; transition: opacity .25s var(--ease-3); outline: none; }
#arch [data-g] .box, #arch [data-g] .ring { transition: stroke .2s, stroke-width .2s, filter .25s; }
#arch [data-g]:hover .box, #arch [data-g]:hover .ring, #arch [data-g]:focus-visible .box, #arch [data-g]:focus-visible .ring { stroke: var(--ink); stroke-width: 2.5; }
#arch [data-g].hl .box, #arch [data-g].hl .ring { filter: drop-shadow(0 6px 14px rgb(0 0 0 / .12)); }
.arch-info { display: grid; gap: 4px; margin-top: 10px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); font-size: 14.5px; min-height: 64px; animation: fade-up .35s var(--ease-out-5) both; }
.arch-info b { font-size: 15px; letter-spacing: -0.01em; }
.arch-info.idle { background: transparent; border-style: dashed; color: var(--muted); }
.arch-info .ai-k { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }
.formula .part { cursor: pointer; transition: transform .25s var(--ease-3), box-shadow .25s, border-color .2s; }
